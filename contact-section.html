<!--
  SJ ONE — Contact(문의) 네이비 섹션 (코드위젯용, self-contained)
  템플릿 "Get in touch with us" 디자인 재현 + 실제 연락처 + 픽토그램(SVG 내장).
  사용: Contact/Support 섹션 코드위젯에 통째로 붙여넣기.
  ※ 위젯이 네이비 배경을 직접 그림. 완전한 풀블리드 원하면 섹션 배경도 #081b33로.
-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<div class="sjcontact">
  <style>
    .sjcontact{ background:#081b33; color:#fff; padding:90px 24px; text-align:center;
      font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
    .sjcontact *{ box-sizing:border-box; }
    .sjcontact .eyebrow{ font-size:14px; font-weight:700; letter-spacing:.5px; margin:0 0 18px; color:#fff; }
    .sjcontact h2{ font-size:50px; font-weight:700; line-height:1.1; margin:0 0 20px; color:#fff; }
    .sjcontact .sub{ font-size:15px; line-height:1.75; color:rgba(255,255,255,.8); margin:0 auto 48px; white-space:nowrap; }
    .sjcontact .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:26px; max-width:1100px; margin:0 auto; }
    .sjcontact .card{ background:#fff; padding:34px 32px; text-align:left; min-height:168px; }
    .sjcontact .card .top{ display:flex; align-items:center; gap:11px; margin:0 0 20px; }
    .sjcontact .card .top svg{ flex:0 0 auto; }
    .sjcontact .card .lbl{ color:#555; font-size:16px; font-weight:500; }
    .sjcontact .card .val{ color:#1d1d1d; font-size:21px; font-weight:700; margin:0; word-break:break-word; line-height:1.35; }
    .sjcontact .card .val a{ color:#1d1d1d; text-decoration:none; }
    .sjcontact .card .val a:hover{ text-decoration:underline; }
    .sjcontact .card .sub2{ color:#999; font-size:14px; font-weight:500; margin:8px 0 0; }
    @media(max-width:820px){ .sjcontact h2{ font-size:34px; } .sjcontact .sub{ white-space:normal; max-width:440px; } .sjcontact .grid{ grid-template-columns:1fr; max-width:440px; } }
  </style>

  <p class="eyebrow">Contact</p>
  <h2>Get in touch with us</h2>
  <p class="sub">시편 가공 장비 및 소모품 관련 문의는 아래 연락처로 연락 주시면 신속히 안내해 드리겠습니다.</p>

  <div class="grid">
    <div class="card">
      <div class="top">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e54a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M3 6l9 7 9-7"/></svg>
        <span class="lbl">Email</span>
      </div>
      <p class="val"><a href="mailto:sjone@sjtrade.co.kr">sjone@sjtrade.co.kr</a></p>
    </div>

    <div class="card">
      <div class="top">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e54a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.12.9.33 1.8.62 2.7a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.38-1.17a2 2 0 0 1 2.1-.45c.9.29 1.8.5 2.7.62A2 2 0 0 1 22 16.9z"/></svg>
        <span class="lbl">Phone</span>
      </div>
      <p class="val"><a href="tel:0220419770">02-2041-9770</a></p>
      <p class="sub2">Fax&nbsp; 02-2041-9772</p>
    </div>

    <div class="card">
      <div class="top">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e54a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span class="lbl">Address</span>
      </div>
      <p class="val">서울 강동구 올림픽로 664<br>대우한강베네시티 102-705</p>
    </div>
  </div>
</div>
